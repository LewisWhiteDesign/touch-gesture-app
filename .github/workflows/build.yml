name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Builds 1-4 were made in the old lewisw445 repo; carry on numbering after them
      # so new APKs always install over older ones.
      - name: Set build number
        run: echo "BUILD_NUMBER=$(( ${{ github.run_number }} + 4 ))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/LockGestures-0.1.${BUILD_NUMBER}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LockGestures-apk
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          name: Lock Gestures 0.1.${{ env.BUILD_NUMBER }}
          body: |
            Built from commit ${{ github.sha }}.
            Download the .apk below on your phone to install or update.
          files: out/*.apk
          make_latest: true
